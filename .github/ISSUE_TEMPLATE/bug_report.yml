name: Bug report
description: Report a problem with CasCet
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security-sensitive issues, follow
        SECURITY.md (private report) instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I run `cascet connect`, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or actions that trigger the bug.
      placeholder: |
        1. pnpm install --frozen-lockfile && pnpm build
        2. npx @cascet/cli@latest connect http://127.0.0.1:4410/mcp
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - gateway (cascet wrap)
        - client (cascet connect)
        - agent
        - cli
        - facilitator (self-hosted, tools/e2e)
        - python client
        - dashboard
        - contracts
        - docs / other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version, @cascet/* versions, network (testnet or mainnet), and (if relevant) Rust version.
      placeholder: macOS 15, Node 22.14, pnpm 10.20.0, @cascet/cli 0.1.1
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Redact any keys or secrets.
      render: shell
    validations:
      required: false
