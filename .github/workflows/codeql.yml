name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan, Mondays 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions: the workflows in .github/workflows
        # javascript-typescript: packages/*, servers/*, apps/dashboard, tools/*
        # python: clients/python
        # rust: contracts (Odra)
        language: ["actions", "javascript-typescript", "python", "rust"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust extractor runs cargo internally; give it the toolchain pinned
      # by the toolchain file in contracts/ instead of letting rustup guess.
      - name: Install the pinned Rust toolchain
        if: matrix.language == 'rust'
        working-directory: contracts
        run: rustup toolchain install --no-self-update --profile minimal

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # All four languages are analyzed from source, without a build.
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
