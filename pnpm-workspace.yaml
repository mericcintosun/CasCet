packages:
  - "packages/*"
  - "servers/*"
  - "apps/*"
  - "tools/*"

# Security overrides: force patched transitive deps across the tree.
# Each entry is a FLOOR inside the same major line (never an exact pin), so later
# patch releases and Dependabot security updates still apply.
#  - postcss GHSA-qx2v-qp2m-jg93, GHSA-r28c-9q8g-f849 (path traversal via source maps)
#  - brace-expansion ReDoS/DoS series (GHSA-3jxr-9vmj-r5cp ... GHSA-qhr7-859c-m2p7); via casper-js-sdk>glob>minimatch
#  - fast-uri host-confusion / SSRF series (CVE-2026-16221 ... GHSA-qw65-cvwx-89v3); via @modelcontextprotocol/sdk>ajv
#  - sharp libvips/libheif/librsvg CVEs (GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w); via next
#  - @hono/node-server GHSA-frvp-7c67-39w9 + GHSA-9mqv-5hh9-4cgg; via @modelcontextprotocol/sdk,
#    unused on our path — we serve over Express, never the SDK's streamableHttp server
overrides:
  postcss@<8.5.18: "^8.5.18"
  brace-expansion@<1.1.21: "^1.1.21"
  fast-uri@<3.1.9: "^3.1.9"
  sharp@<0.35.5: "^0.35.5"
  "@hono/node-server@<2.0.10": "^2.0.10"

# Pin the peer-install mode this lockfile was resolved with, so
# `pnpm install --frozen-lockfile` (CI, contributors) no longer depends on
# anyone's global pnpm config; with pnpm's default (true) it fails with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
autoInstallPeers: false
