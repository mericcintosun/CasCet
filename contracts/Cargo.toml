[package]
edition = "2021"
name = "cascet_contracts"
version = "0.1.0"

# All odra-* crates come from crates.io and move together. Do not switch to the
# odra git repository: its `2.9.0` tag points at the same commit as `2.8.2`
# (f49d770), so it lacks the 2.9.0 fixes.
# 2.9.x is the minimum: odra-modules <= 2.8.2 ships a CEP-18 `transfer_from`
# that writes the decremented allowance to (owner, recipient) instead of
# (owner, spender), and DemoToken re-exposes that entry point (finding M33).
[dependencies]
odra = { version = "2.9.1", features = [], default-features = false }
# CEP-18 reference token: deployed alongside RevenueSplit as the demo payment
# token, and used in tests to exercise real token transfers. RevenueSplit's own
# wasm still talks to CEP-18 via a lean self-declared external interface.
odra-modules = { version = "2.9.1", default-features = false }

[dev-dependencies]
odra-test = { version = "2.9.1", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.9.1", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.9.1", features = [], default-features = false }
odra-cli = { version = "2.9.1", features = [], default-features = false }

[[bin]]
name = "cascet_contracts_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "cascet_contracts_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "cascet_contracts_cli"
path = "bin/cli.rs"
test = false

[profile.release]
codegen-units = 1
lto = true
# Integer overflow must trap (reverting the call) in the wasm we ship, as it
# already does in tests; without this a u32/u64 overflow silently wraps.
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3
